<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- Pas de `user-scalable=no` : le zoom qui gene sur iOS est le recadrage
     automatique d'un champ sous 16px, qui ne se defait jamais. Il se corrige
     dans la feuille de style. Un pincement volontaire, lui, se defait en
     pincant : l'interdire est l'anti-motif que Safari refuse depuis iOS 10. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,date=no,address=no">
<title>Tallya</title>
<!-- La description que Google affiche sous le lien. `og:description` ne lui
     suffit pas : les reseaux sociaux lisent l'une, un moteur lit l'autre, et
     sans celle-ci il compose l'extrait avec ce qu'il trouve dans la page — sur
     une application rendue en JavaScript, il ne trouve presque rien. -->
<meta name="description" content="Tallya, a personal wealth dashboard by Pierre-Louis FETET: accounts, markets, allocation, budget and projection. Zero dependencies, no build step, 750+ tests.">
<meta name="author" content="Pierre-Louis FETET">
<meta name="google-site-verification" content="rctWphw3ZS93KFxrhuKJHalCdEqOY7g8SmfAVgTsvcM" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Tallya",
  "applicationCategory": "FinanceApplication",
  "operatingSystem": "Web",
  "url": "https://tallya-demo.pages.dev/",
  "description": "A personal wealth dashboard: accounts, markets, allocation, budget and projection.",
  "license": "https://www.gnu.org/licenses/agpl-3.0.html",
  "author": {
    "@type": "Person",
    "name": "Pierre-Louis FETET",
    "url": "https://github.com/pierrelouis-fetet"
  },
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
}
</script>
<meta property="og:type" content="website">
<meta property="og:title" content="Tallya, a personal wealth dashboard">
<meta property="og:description" content="Accounts, markets, allocation, budget, projection. Zero dependencies, no build step, 750+ tests. Live demo with fictional data.">
<meta property="og:url" content="https://tallya-demo.pages.dev/">
<meta property="og:image" content="https://tallya-demo.pages.dev/docs/desktop-overview.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tallya">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f9fb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2026-09-01f-demo">
<!-- Prechargement de la police des titres : sans lui, le navigateur ne la
     decouvre qu'apres analyse de styles.css et le nom bascule sous les yeux.
     `crossorigin` est obligatoire meme en meme origine — une police se
     recupere toujours en mode CORS. Aucune balise de version ici : cet URL
     doit coincider a l'octet pres avec l'url() de l'@font-face, sinon le
     fichier est telecharge deux fois. -->
<link rel="preload" href="assets/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/styles.css?v=2026-09-01f-demo">
<link rel="icon" href="/icon-192.png?v=2026-09-01f-demo" type="image/png">
</head>

<div class="lancement" id="lancement" aria-hidden="true">

    <img src="/icon-192.png?v=2026-09-01f-demo" alt="" width="72" height="72">
    <span>Tallya</span>

    <em class="lancement-slogan"><span data-i18n="Suivre. Arbitrer.">Track. Steer.</span> <b data-i18n="Projeter.">Project.</b></em>
  </div>
</div>

    <a href="#/budget"     data-view="budget"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.8" y="5.5" width="18.4" height="13" rx="2.6"/><path d="M2.8 10h18.4"/><circle cx="17" cy="14.2" r="1.4"/></svg><span data-i18n="nav.budget">Budget</span><span class="badge" id="badgeBudget" hidden>✎</span></a>

    
    <span class="nav-groupe" data-i18n="nav.group.portfolio">Portfolio</span>

    <a href="#/positions"  data-view="positions"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><polyline points="3,16.5 9,10.5 13,14.5 21,6"/><polyline points="15.5,6 21,6 21,11.5"/></svg><span data-i18n="nav.positions">Markets</span></a>
    <a href="#/accounts"   data-view="accounts"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 21 7.6l-9 4.4-9-4.4Z"/><path d="M3 12.2l9 4.4 9-4.4"/><path d="M3 16.8l9 4.4 9-4.4"/></svg><span data-i18n="nav.accounts">Assets</span></a>

    <a href="#/settings"   data-view="settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h9.2"/><path d="M18.4 8.5H20"/><circle cx="15.8" cy="8.5" r="2.1"/><path d="M4 15.5h4.2"/><path d="M13.4 15.5H20"/><circle cx="10.8" cy="15.5" r="2.1"/></svg><span data-i18n="nav.settings">Preferences</span></a>

    <div class="nav-outils">
