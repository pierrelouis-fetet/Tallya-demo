<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tallya — tests</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/styles.css?v=2026-09-12w-demo">
<style>
  body { padding: 24px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .bilan { font-size: 15px; font-weight: 650; padding: 12px 16px; border-radius: 10px;
           margin: 16px 0 24px; border: 1px solid var(--border); }
  .bilan.vert { color: var(--good); border-color: color-mix(in oklab, var(--good) 45%, transparent); }
  .bilan.rouge { color: var(--critical); border-color: color-mix(in oklab, var(--critical) 45%, transparent); }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em;
       color: var(--text-secondary); margin: 22px 0 8px; }
  .cas { display: flex; gap: 10px; padding: 6px 0; align-items: baseline;
         border-bottom: 1px solid var(--grid); }
  .cas .marque { flex: none; width: 16px; font-weight: 700; }
  .cas.ok .marque { color: var(--good); }
  .cas.ko .marque { color: var(--critical); }
  .cas.ko { color: var(--critical); }
  pre { margin: 6px 0 10px 26px; padding: 10px 12px; background: var(--surface-2);
        border-radius: 8px; font-size: 12px; white-space: pre-wrap;
        color: var(--text-primary); }
</style>
</head>
<body>

<h1>Tallya — tests</h1>
<p class="sub">Le calcul de <code>store.js</code>, sans navigateur piloté ni données réelles.
   Recharge la page pour relancer.</p>

<div id="bilan" class="bilan">exécution…</div>
<div id="detail"></div>

<!--
  Ordre imposé : `store.js` lit `SEED` et `SEED_BUDGET` au chargement. Ni
  `app.js` ni `charts.js` ne sont nécessaires — tout ce qui se teste ici est du
  calcul pur, sans DOM. C'est aussi ce qui rend ces tests instantanés.

  Aucun `localStorage` n'est lu : chaque test pose son propre patrimoine par
  `Fixture.poser()`. La page peut donc tourner sur la machine de n'importe qui
  sans rien voir de personnel, et deux exécutions donnent le même résultat.
-->
<script src="assets/i18n.js?v=2026-09-12w-demo"></script>
<script src="assets/seed-budget.js?v=2026-09-12w-demo"></script>
<script src="assets/seed.js?v=2026-09-12w-demo"></script>
<script src="assets/store.js?v=2026-09-12w-demo"></script>

<script src="tests/harness.js?v=2026-09-12w-demo"></script>
<script src="tests/fixture.js?v=2026-09-12w-demo"></script>
<script src="tests/store.tests.js?v=2026-09-12w-demo"></script>

<script>
  const langueDetenteur = currentLang();
  setLang('fr');
  (async () => {
  const params = new URLSearchParams(location.search);
  const selection = { nom: params.get('suites') || '', touche: params.get('touche') || '' };

  let r;
  const debut = performance.now();
  try { r = await Tests.run(selection); }
  catch (e) {
    document.getElementById('bilan').className = 'bilan rouge';
    document.getElementById('bilan').textContent = e.message;
    document.title = '✕ selection vide — Tallya';
    setLang(langueDetenteur);
    return;
  }
  finally { setLang(langueDetenteur); }
  const duree = (performance.now() - debut) / 1000;
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  const bilan = document.getElementById('bilan');
  bilan.className = 'bilan ' + (r.ko ? 'rouge' : 'vert');
  bilan.textContent = (r.ko
    ? `${r.ko} échec${r.ko > 1 ? 's' : ''} sur ${r.total} tests`
    : `${r.ok} tests passent`) + ` · ${duree.toFixed(1)} s`
    + (r.partiel ? ` · PARTIEL, ${r.suites} suite${r.suites > 1 ? 's' : ''} sur ${Tests.choisir().length}` : '');

  document.getElementById('detail').innerHTML = r.resultats.map(s => `
    <h2>${esc(s.nom)}</h2>
    ${s.cas.map(c => `
      <div class="cas ${c.ok ? 'ok' : 'ko'}">
        <span class="marque">${c.ok ? '✓' : '✕'}</span><span>${esc(c.nom)}</span>
      </div>
      ${c.ok ? '' : `<pre>${esc(c.erreur)}</pre>`}`).join('')}`).join('');

  document.title = `${r.ko ? '✕ ' + r.ko + ' échecs' : '✓ ' + r.ok + ' tests'}`
    + (r.partiel ? ' (PARTIEL)' : '') + ' — Tallya';
  })();
</script>
</body>
</html>
